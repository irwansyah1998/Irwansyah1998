              <div style="margin-top:10px;font-size:15px;font-weight:800;color:#f7f7fb;">D3 Informatics Engineering</div>
              <div style="margin-top:6px;font-size:13px;color:#d5dbe6;">GPA 3.50</div>
              <div style="margin-top:2px;font-size:13px;color:#d5dbe6;">Graduated 2020</div>
            </div>

            <div style="padding:22px 20px;border-radius:22px;border:1px solid rgba(214,173,92,0.17);background:linear-gradient(135deg, rgba(214,173,92,0.08), rgba(255,255,255,0.02));">
              <div class="luxury mini" style="font-size:9px;color:#d7b972;">Core Strength</div>
              <div style="margin-top:10px;font-size:15px;font-weight:800;color:#f7f7fb;">Backend Systems</div>
              <div style="margin-top:6px;font-size:13px;color:#d5dbe6;">API Architecture</div>
              <div style="margin-top:2px;font-size:13px;color:#d5dbe6;">Problem Solving</div>
            </div>
          </div>
        </div>

        <div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;padding:28px 42px 0 42px;">
          <div style="padding:20px 22px;border-radius:18px;border:1px solid rgba(214,173,92,0.14);background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(214,173,92,0.04));">
            <div class="luxury mini" style="font-size:9px;color:#d7b972;margin-bottom:10px;">Featured Project</div>
            <div style="font-size:15px;font-weight:800;color:#f7f7fb;">Sistem Pengelola Data di Perusahaan Konfeksi Berbasis Web Menggunakan CodeIgniter 3</div>
            <div style="margin-top:8px;font-size:13px;line-height:1.8;color:#dfe6f5;">
              Built a web-based data management system for a garment company using CodeIgniter 3, with a focus on organized operational workflows, data processing efficiency, and practical business support.
            </div>
            <div style="margin-top:10px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#f7d98f;">GitHub: github.com/irwansyah1998/TugasAkhir</div>
          </div>

          <div style="padding:20px 22px;border-radius:18px;border:1px solid rgba(214,173,92,0.14);background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(214,173,92,0.04));">
            <div class="luxury mini" style="font-size:9px;color:#d7b972;margin-bottom:10px;">Featured Project</div>
            <div style="font-size:15px;font-weight:800;color:#f7f7fb;">SiMadik - Sistem Manajemen Pendidikan</div>
            <div style="margin-top:8px;font-size:13px;line-height:1.8;color:#dfe6f5;">
              Developed an education management system designed to streamline school administration, academic data management, and operational processes in a structured digital environment.
            </div>
            <div style="margin-top:10px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#f7d98f;">GitHub: github.com/irwansyah1998/SiMadik</div>
          </div>
        </div>

        <div style="position:relative;z-index:1;padding:28px 42px 42px 42px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:22px 0 0 0;">
            <div style="flex:1;min-width:0;">
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;">
              <div class="social-pill">
                <span class="social-icon instagram-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.8" y="3.8" width="16.4" height="16.4" rx="4.6"/><circle cx="12" cy="12" r="3.6"/><circle cx="17.3" cy="6.8" r="1.1" fill="#ffffff" stroke="none"/></svg>
                </span>
                @Dwikora63
              </div>
              <div class="social-pill">
                <span class="social-icon linkedin-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 8.4a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2ZM3.8 10.2h2.8v9.1H3.8v-9.1Zm6 0h2.7v1.2h.1c.4-1 1.8-2.1 3.9-2.1 4.1 0 4.9 2.7 4.9 6.2v5.8h-2.8v-5.4c0-1.3 0-3-1.8-3-1.8 0-2.1 1.4-2.1 2.9v5.5h-2.8V10.2Z"/></svg>
                </span>
                Indra Gunawan Ardiansyah
              </div>
              <div class="social-pill">
                <span class="social-icon gmail-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="5.5" width="17.6" height="13" rx="2.2"/><path d="M4.2 7.2 12 12.8l7.8-5.6"/></svg>
                </span>
                nigun1998@gmail.com
              </div>
            </div>
          </div>
