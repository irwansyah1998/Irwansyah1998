<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="100%" height="100%" viewBox="0 0 900 420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b12" />
      <stop offset="35%" stop-color="#131a2a" />
      <stop offset="100%" stop-color="#070910" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6e7b2" />
      <stop offset="20%" stop-color="#d8b86d" />
      <stop offset="48%" stop-color="#f5d98d" />
      <stop offset="100%" stop-color="#b8892e" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0c1017" />
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#f6d68f" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#a47126" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <style>
      .luxury-text { font-family: "Segoe UI", Arial, sans-serif; }
      .small { letter-spacing: 0.18em; text-transform: uppercase; }
      .led-line {
        position: absolute;
        left: 1.4%;
        right: 1.4%;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(246, 214, 138, 0.05) 10%,
          rgba(246, 214, 138, 0.9) 25%,
          rgba(255, 255, 255, 0.95) 50%,
          rgba(246, 214, 138, 0.9) 75%,
          rgba(246, 214, 138, 0.05) 90%,
          transparent 100%);
        background-size: 220% 100%;
        animation: ledFlow 4s linear infinite;
        box-shadow: 0 0 10px rgba(246, 214, 138, 0.9);
      }
      @keyframes ledFlow {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 10px rgba(246,214,138,0.18), 0 0 18px rgba(246,214,138,0.10); }
        50% { box-shadow: 0 0 20px rgba(246,214,138,0.38), 0 0 28px rgba(246,214,138,0.18); }
      }
    </style>
  </defs>

  <rect width="900" height="420" fill="url(#bg)"/>
  <rect width="900" height="420" fill="url(#glow)"/>

  <foreignObject x="0" y="0" width="900" height="420">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;min-height:240px;box-sizing:border-box;position:relative;padding:24px;">
      <div style="width:100%;height:100%;background:linear-gradient(135deg, rgba(15,17,25,0.95), rgba(8,10,16,0.94));border:1px solid rgba(214,173,92,0.45);border-radius:26px;box-shadow:0 22px 52px rgba(0,0,0,0.62);position:relative;overflow:hidden;animation:glowPulse 3s ease-in-out infinite;">
        <div class="led-line" style="top:10px;"></div>
        <div class="led-line" style="bottom:10px; animation-delay:1.3s;"></div>
        <div style="position:absolute;inset:0;background:linear-gradient(120deg, transparent 0%, rgba(214,173,92,0.08) 40%, transparent 100%);"></div>

        <div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:26px 28px 0 28px;z-index:1;">
          <div style="display:flex;align-items:center;gap:18px;min-width:0;flex:1;">
            <div style="width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#f4d68a,#b98b38,#2d1d0c);display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(214,173,92,0.5);border:2px solid rgba(255,236,176,0.7);flex-shrink:0;">
              <div style="font-family:'Segoe UI',Arial,sans-serif;font-size:28px;font-weight:700;letter-spacing:2px;color:#20160d;">IGA</div>
            </div>
            <div style="min-width:0;">
              <div class="luxury-text small" style="font-size:11px;color:#c4a86b;letter-spacing:0.22em;margin-bottom:8px;">Software Engineer</div>
              <div class="luxury-text" style="font-size:34px;font-weight:700;line-height:1.1;color:#f5f7fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Indra Gunawan Ardiansyah</div>
              <div class="luxury-text" style="font-size:14px;color:#d1d7e3;letter-spacing:0.12em;text-transform:uppercase;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Full Stack Developer • Laravel Specialist</div>
            </div>
          </div>

          <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:260px;flex-shrink:0;">
            <span style="padding:8px 12px;border-radius:999px;border:1px solid rgba(214,173,92,0.38);background:rgba(214,173,92,0.08);color:#f6d98e;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">PHP</span>
            <span style="padding:8px 12px;border-radius:999px;border:1px solid rgba(214,173,92,0.38);background:rgba(214,173,92,0.08);color:#f6d98e;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">Laravel</span>
            <span style="padding:8px 12px;border-radius:999px;border:1px solid rgba(214,173,92,0.38);background:rgba(214,173,92,0.08);color:#f6d98e;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">API</span>
            <span style="padding:8px 12px;border-radius:999px;border:1px solid rgba(214,173,92,0.38);background:rgba(214,173,92,0.08);color:#f6d98e;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">UI/UX</span>
          </div>
        </div>

        <div style="position:relative;display:flex;gap:18px;padding:20px 28px 0 28px;z-index:1;">
          <div style="flex:1.2;background:rgba(255,255,255,0.02);border:1px solid rgba(214,173,92,0.18);border-radius:18px;padding:18px 18px 14px 18px;min-width:0;">
            <div class="luxury-text small" style="font-size:11px;color:#c4a86b;letter-spacing:0.22em;margin-bottom:10px;">About Me</div>
            <p style="margin:0;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.75;color:#e7ebf5;">
              Indra Gunawan Ardiansyah is a passionate digital developer who enjoys turning ideas into reliable, scalable, and user-friendly systems.
              With a strong focus on backend architecture, he builds clean code, efficient APIs, and practical solutions that help businesses work smarter.
              He is especially interested in modern web development, Laravel-based applications, API design, and seamless user experiences.
            </p>
          </div>

          <div style="flex:0.9;display:flex;flex-direction:column;gap:12px;min-width:220px;">
            <div style="background:linear-gradient(135deg, rgba(214,173,92,0.12), rgba(255,255,255,0.02));border:1px solid rgba(214,173,92,0.22);border-radius:16px;padding:14px 16px;">
              <div class="luxury-text small" style="font-size:10px;color:#d7ba73;letter-spacing:0.2em;">Focus</div>
              <div style="margin-top:8px;font-size:15px;font-weight:600;color:#f5f7fb;">Backend Architecture</div>
              <div style="font-size:12px;color:#c9d1e0;margin-top:4px;">Clean logic, secure APIs, scalable systems.</div>
            </div>

            <div style="background:linear-gradient(135deg, rgba(214,173,92,0.12), rgba(255,255,255,0.02));border:1px solid rgba(214,173,92,0.22);border-radius:16px;padding:14px 16px;">
              <div class="luxury-text small" style="font-size:10px;color:#d7ba73;letter-spacing:0.2em;">Strength</div>
              <div style="margin-top:8px;font-size:15px;font-weight:600;color:#f5f7fb;">Problem Solving</div>
              <div style="font-size:12px;color:#c9d1e0;margin-top:4px;">Turning complexity into simple, elegant solutions.</div>
            </div>
          </div>
        </div>

        <div style="position:relative;display:flex;justify-content:space-between;align-items:flex-end;padding:18px 28px 22px 28px;z-index:1;gap:16px;">
          <div style="display:flex;flex-direction:column;gap:8px;min-width:0;flex:1;">
            <div class="luxury-text small" style="font-size:10px;color:#d7ba73;letter-spacing:0.22em;">Profile</div>
            <div style="font-size:12px;color:#dfe6f5;line-height:1.7;max-width:510px;">
              Inspired by craftsmanship and continuous learning, Indra enjoys building digital products that are not only functional, but also elegant and meaningful.
            </div>
          </div>

          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
            <div style="padding:9px 14px;border-radius:12px;border:1px solid rgba(214,173,92,0.35);background:rgba(214,173,92,0.08);color:#f7d98f;font-weight:700;font-size:12px;letter-spacing:0.09em;text-transform:uppercase;">Available</div>
            <div style="padding:9px 14px;border-radius:12px;border:1px solid rgba(214,173,92,0.35);background:rgba(214,173,92,0.08);color:#f7d98f;font-weight:700;font-size:12px;letter-spacing:0.09em;text-transform:uppercase;">Indonesia</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
