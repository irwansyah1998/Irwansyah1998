            <span style="padding:10px 16px;border-radius:999px;border:1px solid rgba(214,173,92,0.28);background:rgba(214,173,92,0.08);color:#f7d98f;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;">Laravel</span>
            <span style="padding:10px 16px;border-radius:999px;border:1px solid rgba(214,173,92,0.28);background:rgba(214,173,92,0.08);color:#f7d98f;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;">API</span>
            <span style="padding:10px 16px;border-radius:999px;border:1px solid rgba(214,173,92,0.28);background:rgba(214,173,92,0.08);color:#f7d98f;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;">System Design</span>
          </div>
        </div>

        <div style="position:relative;z-index:1;display:grid;grid-template-columns:1.618fr 1fr;gap:18px;padding:32px 42px 0 42px;">
          <div style="padding:24px 22px;border-radius:24px;border:1px solid rgba(214,173,92,0.15);background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(214,173,92,0.04));">
            <div class="luxury mini" style="font-size:10px;color:#d7b972;margin-bottom:12px;">Professional Summary</div>
            <p style="margin:0;font-family:'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.8;color:#edf1f8;">
              I build scalable backend systems, secure APIs, and digital solutions that support operational efficiency and business growth. My work is centered on creating reliable, maintainable, and user-focused platforms that translate complex needs into clear and effective applications.
            </p>
